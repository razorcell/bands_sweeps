<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Backtest Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="trades_data.js" onerror="console.log('No auto-loaded data yet')"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --glass-blur: blur(12px);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: var(--glass-blur);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .upload-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            background: var(--panel-bg);
            border: 1px dashed var(--border-color);
            border-radius: 16px;
            backdrop-filter: var(--glass-blur);
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .file-input-wrapper input[type=file], .file-input-wrapper input[type=webkitdirectory] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: var(--glass-blur);
        }

        .stat-title {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .chart-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: var(--glass-blur);
            min-height: 400px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .positive { color: var(--success); }
        .negative { color: var(--danger); }

        @media (max-width: 1024px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>MT5 Edge Analyzer</h1>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Insights on Trade Entry Speed vs. Profitability</p>
    </header>

    <div class="container">
        
        <div class="upload-section" id="upload-section">
            <div class="file-input-wrapper">
                <button class="btn">Select Additional Reports manually</button>
                <input type="file" id="fileInput" multiple accept=".html">
            </div>
            
            <div id="report-selector-container" style="display: none; margin-left: auto;">
                <label for="reportSelect" style="color: var(--text-muted); margin-right: 10px;">Select Report:</label>
                <select id="reportSelect" class="btn" style="appearance: auto; padding: 0.5rem 1rem;">
                    <option value="all">All Combined Reports</option>
                </select>
            </div>
            
            <div style="margin-left: 20px; color: var(--text-muted);" id="upload-status">Awaiting files...</div>
        </div>

        <div class="stats-grid" id="stats-grid" style="display: none;">
            <div class="stat-card">
                <div class="stat-title">Total Analyzed Trades</div>
                <div class="stat-value" id="totalTrades">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Overall Win Rate</div>
                <div class="stat-value" id="winRate">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Most Profitable Speed Range</div>
                <div class="stat-value positive" id="bestSpeed">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Most Loss-Making Speed Range</div>
                <div class="stat-value negative" id="worstSpeed">-</div>
            </div>
        </div>

        <div class="charts-container" id="charts-container" style="display: none;">
            <div class="chart-box">
                <h3 style="margin-top:0;">Speed vs. Profit Extravaganza (Scatter)</h3>
                <div style="position: relative; height: 350px;">
                    <canvas id="scatterChart"></canvas>
                </div>
            </div>
            <div class="chart-box">
                <h3 style="margin-top:0;">Net Profit by Speed Group</h3>
                <div style="position: relative; height: 350px;">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Chart instances
        let scatterChartInstance = null;
        let barChartInstance = null;
        let allReports = [];

        document.getElementById('fileInput').addEventListener('change', handleFiles);
        document.getElementById('reportSelect').addEventListener('change', handleReportSelection);

        document.addEventListener('DOMContentLoaded', () => {
            if (window.autoLoadedReports && window.autoLoadedReports.length > 0) {
                allReports = window.autoLoadedReports;
                
                let totalTrades = 0;
                allReports.forEach(r => totalTrades += r.trades.length);
                
                document.getElementById('upload-status').innerHTML = `<span style="color:var(--success);">Automagically loaded ${allReports.length} reports!</span>`;
                
                populateReportDropdown();
                handleReportSelection(); // Loads "All Combined Reports" by default
            }
        });
        
        function populateReportDropdown() {
            const select = document.getElementById('reportSelect');
            // Keep the "All Combined Reports" option
            select.innerHTML = '<option value="all">All Combined Reports</option>';
            
            allReports.forEach((report, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = report.filename + ` (${report.trades.length} trades)`;
                select.appendChild(option);
            });
            
            document.getElementById('report-selector-container').style.display = 'flex';
        }
        
        function handleReportSelection() {
            const select = document.getElementById('reportSelect');
            const val = select.value;
            
            let tradesToShow = [];
            if (val === "all") {
                allReports.forEach(report => {
                    tradesToShow = tradesToShow.concat(report.trades);
                });
            } else {
                tradesToShow = allReports[parseInt(val)].trades;
            }
            
            if (tradesToShow.length > 0) {
                document.getElementById('stats-grid').style.display = 'grid';
                document.getElementById('charts-container').style.display = 'grid';
                updateDashboard(tradesToShow);
            } else {
                document.getElementById('stats-grid').style.display = 'none';
                document.getElementById('charts-container').style.display = 'none';
            }
        }

        async function handleFiles(event) {
            const files = Array.from(event.target.files).filter(f => f.name.endsWith('.html') || f.name.endsWith('.htm'));
            if (files.length === 0) return;

            document.getElementById('upload-status').textContent = `Processing ${files.length} file(s)...`;
            allTradesExtracted = [];

            for (const file of files) {
                try {
                    const trades = await parseMT5Report(file);
                    
                    // Check if report already exists by filename
                    const existingIndex = allReports.findIndex(r => r.filename === file.name);
                    if (existingIndex !== -1) {
                        allReports[existingIndex].trades = trades; // Overwrite
                    } else {
                        allReports.push({ filename: file.name, trades: trades });
                    }
                } catch (err) {
                    console.error("Error parsing file", file.name, err);
                }
            }
            
            let totalTrades = 0;
            allReports.forEach(r => totalTrades += r.trades.length);

            document.getElementById('upload-status').textContent = `Done. Total ${totalTrades} trades loaded.`;
            
            if (allReports.length > 0) {
                populateReportDropdown();
                handleReportSelection();
            }
        }

        async function parseMT5Report(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const arrayBuffer = e.target.result;
                    // MT5 reports are often UTF-16LE. If reading as UTF-8 messes up, we decode it.
                    let htmlString = "";
                    const view = new Uint8Array(arrayBuffer);
                    
                    // Basic check for UTF-16LE (alternating nulls)
                    if (view.length > 4 && view[1] === 0) {
                        htmlString = new TextDecoder('utf-16le').decode(arrayBuffer);
                    } else {
                        htmlString = new TextDecoder('utf-8').decode(arrayBuffer);
                    }

                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlString, 'text/html');
                    const tables = doc.querySelectorAll('table');
                    const trades = [];

                    tables.forEach(table => {
                        const rows = table.querySelectorAll('tr');
                        if (rows.length < 2) return;

                        let dirIdx = -1;
                        let headerIdx = -1;

                        // Scan all rows to find the actual table headers (in MT5 this could be row 700+)
                        for (let r = 0; r < rows.length; r++) {
                            const tds = rows[r].querySelectorAll('td, th');
                            let foundProfit = false;
                            
                            tds.forEach((td, idx) => {
                                const text = td.textContent.trim().toLowerCase();
                                if (text === 'profit') { profitIdx = idx; foundProfit = true; }
                                if (text === 'comment' || text === 'comments') commentIdx = idx;
                                if (text === 'direction') dirIdx = idx;
                            });
                            
                            // We need profit and comment. Break if we found profit in THIS row.
                            if (profitIdx !== -1 && commentIdx !== -1 && foundProfit) {
                                headerIdx = r;
                                break;
                            }
                        }

                        if (headerIdx !== -1) {
                            let pendingSpeed = null;
                            let pendingComment = null;

                            for (let i = headerIdx + 1; i < rows.length; i++) {
                                const cells = rows[i].querySelectorAll('td');
                                if (cells.length > Math.max(profitIdx, commentIdx)) {
                                    const profitText = cells[profitIdx].textContent.trim().replace(/[^\d.-]/g, '');
                                    const commentText = cells[commentIdx].textContent.trim();
                                    const profit = parseFloat(profitText);
                                    
                                    const speedMatch = commentText.match(/\|\s*(-?\d+(?:\.\d+)?)\s*pts\/s/i) || 
                                                       commentText.match(/speed.*?(-?\d+(?:\.\d+)?)/i) || 
                                                       commentText.match(/spd.*?(-?\d+(?:\.\d+)?)/i);

                                    if (dirIdx !== -1 && cells.length > dirIdx) {
                                        const direction = cells[dirIdx].textContent.trim().toLowerCase();
                                        if (direction === 'in') {
                                            if (speedMatch) {
                                                pendingSpeed = parseFloat(speedMatch[1]);
                                                pendingComment = commentText;
                                            }
                                        } else if (direction === 'out' && pendingSpeed !== null) {
                                            if (!isNaN(profit)) {
                                                trades.push({ profit, speed: pendingSpeed, comment: pendingComment });
                                            }
                                            pendingSpeed = null;
                                            pendingComment = null;
                                        }
                                    } else {
                                        // Fallback if no direction column
                                        if (!isNaN(profit) && profit !== 0 && speedMatch) {
                                            const speed = parseFloat(speedMatch[1]);
                                            trades.push({ profit, speed, comment: commentText });
                                        }
                                    }
                                }
                            }
                        }
                    });

                    resolve(trades);
                };
                reader.onerror = (e) => reject(e);
                reader.readAsArrayBuffer(file);
            });
        }

        function updateDashboard(trades) {
            // 1. Calculate general stats
            const total = trades.length;
            const wins = trades.filter(t => t.profit > 0).length;
            const winRate = ((wins / total) * 100).toFixed(2);

            // 2. Group by speed ranges (bucket size of 10)
            const speedBuckets = {};
            trades.forEach(t => {
                const bucket = Math.floor(t.speed / 10) * 10; 
                const bucketLabel = `${bucket} to ${bucket + 9}`;
                if (!speedBuckets[bucketLabel]) {
                    speedBuckets[bucketLabel] = { profit: 0, count: 0, wins: 0 };
                }
                speedBuckets[bucketLabel].profit += t.profit;
                speedBuckets[bucketLabel].count += 1;
                if (t.profit > 0) speedBuckets[bucketLabel].wins += 1;
            });

            let bestBucket = null;
            let worstBucket = null;
            let bestProfit = -Infinity;
            let worstProfit = Infinity;

            for (const [label, data] of Object.entries(speedBuckets)) {
                if (data.profit > bestProfit) {
                    bestProfit = data.profit;
                    bestBucket = label;
                }
                if (data.profit < worstProfit) {
                    worstProfit = data.profit;
                    worstBucket = label;
                }
            }

            document.getElementById('totalTrades').textContent = total;
            document.getElementById('winRate').textContent = `${winRate}%`;
            document.getElementById('bestSpeed').textContent = bestBucket ? `${bestBucket} pt/s` : '-';
            document.getElementById('worstSpeed').textContent = worstBucket ? `${worstBucket} pt/s` : '-';

            renderCharts(trades, speedBuckets);
        }

        function renderCharts(trades, speedBuckets) {
            // Setup Scatter Chart
            const scatterData = trades.map(t => ({
                x: t.speed,
                y: t.profit,
                comment: t.comment
            }));

            // Color green for win, red for loss
            const pointColors = trades.map(t => t.profit >= 0 ? 'rgba(16, 185, 129, 0.6)' : 'rgba(239, 68, 68, 0.6)');

            if (scatterChartInstance) scatterChartInstance.destroy();
            const ctxScatter = document.getElementById('scatterChart').getContext('2d');
            
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = 'Inter';

            scatterChartInstance = new Chart(ctxScatter, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: 'Trades',
                        data: scatterData,
                        backgroundColor: pointColors,
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const pt = context.raw;
                                    return `Speed: ${pt.x}, Profit: ${pt.y} | ${pt.comment}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Speed at Entry (pt/s)' },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y: {
                            title: { display: true, text: 'Profit' },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        }
                    }
                }
            });

            // Setup Bar Chart
            const labels = Object.keys(speedBuckets).sort((a, b) => parseInt(a) - parseInt(b));
            const profits = labels.map(l => speedBuckets[l].profit);
            const barColors = profits.map(p => p >= 0 ? 'rgba(16, 185, 129, 0.8)' : 'rgba(239, 68, 68, 0.8)');

            if (barChartInstance) barChartInstance.destroy();
            const ctxBar = document.getElementById('barChart').getContext('2d');
            
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Net Profit',
                        data: profits,
                        backgroundColor: barColors,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
